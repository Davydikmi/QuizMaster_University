<mat-sidenav-container class="layout-shell">
  <mat-sidenav #sidenav class="layout-sidebar" mode="side" opened disableClose>
    <div class="sidebar-brand">
      <div class="sidebar-logo">QM</div>
      <div>
        <div class="sidebar-title">QuizMaster</div>
        <div class="sidebar-subtitle">Университет</div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <mat-nav-list>
      <a mat-list-item class="nav-item" routerLink="/quizzes" routerLinkActive="active">
        <span>Тесты</span>
      </a>
      <a mat-list-item class="nav-item" routerLink="/profile" routerLinkActive="active">
        <span>Профиль</span>
      </a>
      <ng-container *ngIf="isTeacherAreaVisible">
        <mat-divider></mat-divider>
        <a mat-list-item class="nav-item" routerLink="/teacher/courses" routerLinkActive="active" *ngIf="isAdmin">
          <span>Курсы</span>
        </a>
        <a mat-list-item class="nav-item" routerLink="/teacher/create-quiz" routerLinkActive="active">
          <span>Создать тест</span>
        </a>
        <a mat-list-item class="nav-item" routerLink="/teacher/add-questions" routerLinkActive="active">
          <span>Добавить вопросы</span>
        </a>
        <a mat-list-item class="nav-item" routerLink="/teacher/results" routerLinkActive="active">
          <span>Результаты</span>
        </a>
        <a mat-list-item class="nav-item" routerLink="/admin/study-groups" routerLinkActive="active" *ngIf="isAdmin">
          <span>Учебные группы</span>
        </a>
        <a mat-list-item class="nav-item" routerLink="/admin/students" routerLinkActive="active" *ngIf="isAdmin">
          <span>Студенты</span>
        </a>
      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="layout-content">
    <mat-toolbar color="primary" class="top-navbar">
      <button mat-icon-button class="menu-button" aria-label="Toggle navigation" (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="top-navbar-title">QuizMaster Университет</span>
      <span class="top-navbar-spacer"></span>
      <ng-container *ngIf="user; else guestActions">
        <button mat-stroked-button color="accent" class="auth-button" [matMenuTriggerFor]="userMenu">
          {{ user.lastName }} {{ user.firstName }} | {{ user.role }} | {{ user.groupName || 'Без группы' }}
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="logout()">
            <span>Выйти</span>
          </button>
        </mat-menu>
      </ng-container>
      <ng-template #guestActions>
        <button mat-stroked-button color="accent" class="auth-button" routerLink="/auth/login">Войти</button>
      </ng-template>
    </mat-toolbar>

    <main class="page-shell">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
