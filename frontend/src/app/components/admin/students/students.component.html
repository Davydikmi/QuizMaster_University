<section class="teacher-header">
  <div>
    <span class="eyebrow">Администрирование</span>
    <h1>Студенты</h1>
    <p>Просмотр студентов, изменение группы и удаление.</p>
  </div>
</section>

<mat-card class="teacher-card">
  <table mat-table [dataSource]="students" class="mat-elevation-z1 teacher-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>ФИО</th>
      <td mat-cell *matCellDef="let student">{{ student.lastName }} {{ student.firstName }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let student">{{ student.email }}</td>
    </ng-container>

    <ng-container matColumnDef="group">
      <th mat-header-cell *matHeaderCellDef>Группа</th>
      <td mat-cell *matCellDef="let student">{{ student.groupName || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Действия</th>
      <td mat-cell *matCellDef="let student">
        <button mat-stroked-button color="primary" (click)="openStudentDialog(student)">Открыть</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
