<section class="teacher-header">
  <div>
    <span class="eyebrow">Аналитика преподавателя</span>
    <h1>Результаты студентов</h1>
    <p>Сводная таблица результатов по тестам и курсам.</p>
  </div>
</section>

<mat-card class="teacher-card">
  <table mat-table [dataSource]="results" class="mat-elevation-z1 teacher-table">

    <ng-container matColumnDef="student">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('student')">Студент {{ sortLabel('student') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">{{ row.student }}</td>
    </ng-container>

    <ng-container matColumnDef="quizTitle">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('quizTitle')">Тест {{ sortLabel('quizTitle') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">{{ row.quizTitle }}</td>
    </ng-container>

    <ng-container matColumnDef="course">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('course')">Курс {{ sortLabel('course') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">{{ row.course }}</td>
    </ng-container>

    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('score')">Баллы {{ sortLabel('score') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">{{ row.score }}/{{ row.maxScore }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('status')">Статус {{ sortLabel('status') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-chip class="status-chip" [class.passed]="row.passed" [class.failed]="!row.passed" selected>
          {{ row.passed ? 'Сдано' : 'Не сдано' }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="submittedAt">
      <th mat-header-cell *matHeaderCellDef>
        <button mat-button type="button" class="table-sort-button" (click)="sortBy('submittedAt')">Дата {{ sortLabel('submittedAt') }}</button>
      </th>
      <td mat-cell *matCellDef="let row">{{ row.submittedAt | date:'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Действия</th>
      <td mat-cell *matCellDef="let row">
        <button mat-stroked-button color="warn" (click)="deleteAttempt(row)">Удалить</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
