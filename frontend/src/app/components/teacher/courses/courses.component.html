<section class="teacher-header">
  <div>
    <span class="eyebrow">Панель преподавателя</span>
    <h1>Курсы</h1>
    <p>Управляйте списком курсов, редактируйте информацию и просматривайте статистику.</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCourseDialog()">Новый курс</button>
</section>

<mat-card class="teacher-card">
  <table mat-table [dataSource]="courses" class="mat-elevation-z1 teacher-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Название курса</th>
      <td mat-cell *matCellDef="let course">{{ course.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Описание</th>
      <td mat-cell *matCellDef="let course">{{ course.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="teacherEmail">
      <th mat-header-cell *matHeaderCellDef>Преподаватель</th>
      <td mat-cell *matCellDef="let course">{{ course.teacherEmail || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Действия</th>
      <td mat-cell *matCellDef="let course">
        <button mat-icon-button color="primary" matTooltip="Редактировать" (click)="openCourseDialog(course)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Удалить" (click)="removeCourse(course)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</mat-card>
